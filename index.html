
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b16;color:#dffaff;
font-family:Arial,sans-serif}
main{max-width:650px;margin:auto;padding:22px}
header{text-align:center;letter-spacing:5px;
color:#00dfff;font-size:28px;font-weight:bold}
small{color:#7d9ba8}
.core{width:170px;height:170px;margin:35px auto;
border:3px solid #00dfff;border-radius:50%;
display:grid;place-items:center;
box-shadow:0 0 35px #00bfff88;
animation:pulse 2s infinite alternate}
.core span{font-size:54px;color:#00eaff}
@keyframes pulse{
to{box-shadow:0 0 65px #00eaff}}
.status{text-align:center;color:#00ffaa}
#chat{height:35vh;overflow:auto;padding:15px;
border:1px solid #17516a;border-radius:15px;
background:#091829;margin-top:25px}
.msg{margin:12px 0;line-height:1.5}
.user{color:#ffd27d}
.bot{color:#70eaff}
.controls{display:flex;gap:8px;margin-top:15px}
input{flex:1;min-width:0;background:#102438;
border:1px solid #217c9a;border-radius:10px;
color:white;padding:14px;font-size:16px}
button{background:#00bddd;color:#00131c;
border:0;border-radius:10px;padding:14px;
font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<main>
<header>J.A.R.V.I.S.</header>
<p style="text-align:center">
<small>PERSONAL AI ASSISTANT</small></p>
<div class="core"><span>◈</span></div>
<p class="status">● SYSTEM ONLINE · DEMO</p>
<div id="chat">
<div class="msg bot">
JARVIS: Willkommen. Mein System ist bereit.
</div>
</div>
<div class="controls">
<input id="message" placeholder="Befehl eingeben...">
<button onclick="send()">➤</button>
<button onclick="speak()">🎙️</button>
</div>
</main>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
function say(text){
if(!("speechSynthesis" in window))return;
speechSynthesis.cancel();
const voice=new SpeechSynthesisUtterance(text);
voice.lang="de-DE";
speechSynthesis.speak(voice);
}
function add(who,text){
const line=document.createElement("div");
line.className="msg "+who;
line.textContent=(who==="user"?"DU: ":"JARVIS: ")+text;
chat.appendChild(line);
chat.scrollTop=chat.scrollHeight;
}
function send(){
const text=input.value.trim();
if(!text)return;
add("user",text);
input.value="";
let reply="Befehl empfangen. Mein KI-Gehirn wird später verbunden.";
if(/hallo|servus|hey/i.test(text))
reply="Servus! JARVIS ist einsatzbereit.";
if(/uhrzeit/i.test(text))
reply="Es ist "+new Date().toLocaleTimeString("de-DE");
if(/webseite/i.test(text))
reply="Das Webseiten-Modul wird noch eingerichtet.";
if(/trad|aktie|bitcoin/i.test(text))
reply="Das Trading-Modul ist noch nicht aktiviert.";
add("bot",reply);
say(reply);
}
input.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});
function speak(){
say("JARVIS ist online. Die Spracheingabe wird später eingerichtet.");
}
</script>
</body>
</html>
